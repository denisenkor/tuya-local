name: Humidifier
products:
  - id: sckus4lcmjm5je6z
    manufacturer: Tuvio
    model: TUH04DE
entities:
  - entity: humidifier
    class: humidifier
    dps:
      - id: 1
        type: boolean
        optional: true
        name: switch
      - id: 101
        type: integer
        optional: true
        name: humidity
        range:
          min: 30
          max: 70
        mapping:
          - step: 5
          - dps_val: "OFF"
            value: ""
      - id: 14
        type: integer
        name: current_humidity
      - id: 23
        type: string
        optional: true
        name: mode
        mapping:
          - dps_val: Auto
            value: Auto
          - dps_val: Sleep
            value: Sleep
          - dps_val: level_1
            value: Level 1
          - dps_val: level_2
            value: Level 2
          - dps_val: level_3
            value: Level 3

  - entity: fan
    dps:
      - id: 1
        type: boolean
        optional: true
        name: switch
      - id: 101
        type: string
        optional: true
        name: speed
        mapping:
          - dps_val: "level_1"
            value: 33
          - dps_val: "level_2"
            value: 66
          - dps_val: "level_3"
            value: 100
  - entity: switch
    icon: mdi:radiator
    name: "Подогрев воды"
    dps:
      - id: 26
        type: boolean
        optional: true
        name: switch

  - entity: sensor
    class: humidity
    dps:
      - id: 14
        type: integer
        optional: true
        name: sensor
        unit: "%"
        class: measurement
  - entity: select
    category: config
    name: "Подсветка"
    icon: mdi:wall-sconce-flat
    dps:
      - id: 6
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: OFF
            value: "OFF"
          - dps_val: orange
            value: Orange
          - dps_val: Blue
            value: Blue
          - dps_val: Green
            value: Green
  - entity: select
    translation_key: "timer"
    icon: mdi:timer-outline
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: "cancel"
            value: "cancel"
          - dps_val: "1H"
            value: "1h"
          - dps_val: "2H"
            value: "2h"
          - dps_val: "4H"
            value: "4h"
          - dps_val: "6H"
            value: "6h"
          - dps_val: "8H"
            value: "8h"

  - entity: sensor
    translation_key: "time_remaining"
    icon: "mdi:timer"
    class: "duration"
    category: "diagnostic"
    dps:
      - id: 20
        type: integer
        name: sensor

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 22
        type: bitfield
        optional: true
        name: fault_code
